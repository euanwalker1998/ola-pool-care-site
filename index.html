<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ola Pool Care — Weekly Pool Cleaning in Miami</title>
<meta name="description" content="Weekly residential pool cleaning in Miami. Licensed & insured. 50% off your first month for the first 15 homes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --navy-950:#071B2E;
  --navy-800:#0E3355;
  --navy-700:#134070;
  --teal-600:#147F9E;
  --teal-500:#1A9CBD;
  --teal-400:#4FC0D9;
  --aqua-100:#EAF7F9;
  --aqua-200:#D6F0F4;
  --coral-500:#F2694C;
  --coral-600:#DD5236;
  --white:#FFFFFF;
  --ink:#0B2338;
  --ink-soft:#4E6A7D;
  --ink-faint:#8199A9;
  --line:#CBE6EC;
  --radius-lg:28px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow-soft:0 20px 50px -20px rgba(7,27,46,0.35);
  --wave-speed:26s;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
  margin:0;
  background:var(--aqua-100);
  color:var(--ink);
  font-family:'Manrope',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px;}

.display{
  font-family:'Anton',sans-serif;
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:0.01em;
  line-height:0.96;
  color:var(--navy-800);
}

.eyebrow{
  font-family:'Manrope',sans-serif;
  font-weight:800;
  font-size:12.5px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--teal-600);
}

/* ---------- Announcement bar ---------- */
.announce{
  background:var(--navy-950);
  color:var(--aqua-200);
  text-align:center;
  font-size:13.5px;
  font-weight:600;
  letter-spacing:0.02em;
  padding:9px 20px;
}

.announce strong{color:var(--teal-400);}

/* ---------- Nav ---------- */
.nav{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(234,247,249,0.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}

.nav-inner{
  max-width:1160px;
  margin:0 auto;
  padding:14px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  height:34px;
  width:auto;
}

.brand-word{
  font-family:'Anton',sans-serif;
  font-size:19px;
  color:var(--navy-800);
  letter-spacing:0.01em;
}

.brand-word span{color:var(--teal-600);}

.nav-links{
  display:flex;
  align-items:center;
  gap:30px;
}

.nav-links a{
  font-size:14.5px;
  font-weight:700;
  color:var(--navy-800);
  padding:6px 2px;
  border-bottom:2px solid transparent;
  transition:border-color .18s ease;
}

.nav-links a:hover,
.nav-links a:focus-visible{
  border-color:var(--coral-500);
}

.nav-cta{
  display:flex;
  align-items:center;
  gap:14px;
}

.phone-pill{
  font-weight:800;
  font-size:14px;
  color:var(--navy-800);
  display:flex;
  align-items:center;
  gap:7px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-radius:999px;
  font-weight:800;
  font-size:14.5px;
  padding:13px 24px;
  border:none;
  transition:transform .16s ease, box-shadow .16s ease;
  white-space:nowrap;
}

.btn:focus-visible{
  outline:3px solid var(--teal-600);
  outline-offset:2px;
}

.btn-coral{
  background:var(--coral-500);
  color:var(--white);
  box-shadow:0 12px 24px -10px rgba(242,105,76,0.65);
}

.btn-coral:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 30px -10px rgba(242,105,76,0.75);
}

.btn-ghost{
  background:transparent;
  color:var(--navy-800);
  border:2px solid var(--navy-800);
}

.btn-ghost:hover{
  background:var(--navy-800);
  color:var(--white);
}

.btn-outline-white{
  background:transparent;
  color:var(--white);
  border:2px solid rgba(255,255,255,0.6);
}

.btn-outline-white:hover{
  background:var(--white);
  color:var(--navy-800);
}

.btn-sm{
  padding:10px 18px;
  font-size:13.5px;
}

/* ---------- Hero ---------- */
.hero{
  position:relative;
  background:linear-gradient(
    165deg,
    var(--navy-950) 0%,
    var(--navy-800) 46%,
    var(--teal-600) 100%
  );
  overflow:hidden;
  padding:78px 0 0;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      600px 380px at 82% 8%,
      rgba(79,192,217,0.35),
      transparent 60%
    ),
    radial-gradient(
      500px 320px at 6% 90%,
      rgba(242,105,76,0.18),
      transparent 60%
    );
  pointer-events:none;
}

.hero-inner{
  position:relative;
  z-index:2;
  max-width:1160px;
  margin:0 auto;
  padding:0 28px;
  display:grid;
  grid-template-columns:1.05fr 0.95fr;
  gap:48px;
  align-items:center;
}

.hero-eyebrow{
  color:var(--teal-400);
}

.hero h1{
  color:var(--white);
  font-size:clamp(40px,5.6vw,64px);
  margin:16px 0 20px;
}

.hero h1 .accent{
  color:var(--teal-400);
  position:relative;
  display:inline-block;
}

.hero h1 .underline{
  position:relative;
}

.hero h1 .underline::after{
  content:"";
  position:absolute;
  left:2px;
  right:2px;
  bottom:-6px;
  height:7px;
  background:var(--coral-500);
  border-radius:6px;
}

.hero-sub{
  color:var(--aqua-200);
  font-size:18px;
  line-height:1.55;
  font-weight:500;
  max-width:480px;
  margin-bottom:30px;
}

.hero-ctas{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-bottom:34px;
}

.trust-row{
  display:flex;
  flex-wrap:wrap;
  gap:22px;
}

.trust-item{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--aqua-200);
  font-size:13.5px;
  font-weight:700;
}

.trust-item svg{
  flex:none;
}

.hero-visual{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-bottom:40px;
}

.hero-visual .disc{
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,0.16),
      rgba(255,255,255,0.02) 60%
    );
  filter:blur(1px);
}

.hero-visual img{
  position:relative;
  z-index:2;
  width:min(360px,80%);
  filter:drop-shadow(0 30px 40px rgba(0,0,0,0.35));
  animation:bob 6s ease-in-out infinite;
}

@keyframes bob{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(-14px);}
}

/* ---------- Logo lockup ---------- */
.logo-lockup{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.logo-lockup img{
  width:min(280px,72%);
  filter:drop-shadow(0 20px 30px rgba(0,0,0,0.35));
}

.logo-lockup .lk-title{
  font-family:'Anton',sans-serif;
  text-transform:uppercase;
  font-size:clamp(28px,4vw,42px);
  color:var(--white);
  letter-spacing:0.01em;
  margin-top:6px;
  line-height:1;
}

.logo-lockup .lk-sub{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Manrope',sans-serif;
  font-weight:800;
  font-size:13px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--teal-400);
  margin-top:10px;
}

.logo-lockup .lk-sub::before,
.logo-lockup .lk-sub::after{
  content:"";
  width:22px;
  height:1.5px;
  background:var(--teal-400);
  opacity:0.7;
}

.logo-lockup .lk-loc{
  font-family:'Manrope',sans-serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:0.06em;
  color:var(--aqua-200);
  margin-top:8px;
  opacity:0.85;
}

.footer-brand .logo-lockup{
  align-items:flex-start;
  text-align:left;
  margin-bottom:14px;
}

.footer-brand .logo-lockup img{
  width:120px;
}

.footer-brand .logo-lockup .lk-sub::before{
  display:none;
}

.footer-brand .logo-lockup .lk-title{
  font-size:24px;
  margin-top:10px;
}

.wave-divider{
  position:relative;
  line-height:0;
  width:100%;
  overflow:hidden;
  height:110px;
  margin-top:40px;
}

.wave-divider svg{
  position:absolute;
  bottom:0;
  left:0;
  width:200%;
  height:100%;
  animation:wave-drift var(--wave-speed) linear infinite;
}

.wave-divider .layer-back{
  opacity:0.55;
  animation-duration:calc(var(--wave-speed) * 1.5);
}

@keyframes wave-drift{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* ---------- Value props ---------- */
.section{
  padding:88px 0;
}

.section-head{
  max-width:640px;
  margin:0 auto 48px;
  text-align:center;
}

.section-head h2{
  font-size:clamp(28px,3.4vw,38px);
  margin:12px 0 0;
}

.section-head p{
  color:var(--ink-soft);
  font-size:16px;
  margin-top:12px;
  line-height:1.6;
}

.value-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
}

.value-card{
  background:var(--white);
  border-radius:var(--radius-md);
  padding:32px 26px;
  border:1px solid var(--line);
  box-shadow:0 16px 30px -22px rgba(7,27,46,0.25);
  transition:transform .2s ease, box-shadow .2s ease;
}

.value-card:hover{
  transform:translateY(-5px);
  box-shadow:0 22px 36px -20px rgba(7,27,46,0.3);
}

.icon-badge{
  width:52px;
  height:52px;
  border-radius:14px;
  background:linear-gradient(
    150deg,
    var(--teal-500),
    var(--teal-600)
  );
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:18px;
}

.value-card h3{
  font-size:18px;
  margin:0 0 8px;
  color:var(--navy-800);
}

.value-card p{
  font-size:14.5px;
  color:var(--ink-soft);
  line-height:1.55;
  margin:0;
}

/* ---------- Offer band ---------- */
.offer{
  background:linear-gradient(
    120deg,
    var(--coral-600),
    var(--coral-500) 60%,
    #F08361
  );
  position:relative;
  overflow:hidden;
  padding:64px 0;
}

.offer::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,0.16) 1.5px,
      transparent 1.5px
    );
  background-size:26px 26px;
  opacity:0.5;
}

.offer-inner{
  position:relative;
  z-index:2;
  max-width:1160px;
  margin:0 auto;
  padding:0 28px;
  display:grid;
  grid-template-columns:1.15fr 0.85fr;
  gap:40px;
  align-items:center;
}

.offer-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(7,27,46,0.22);
  color:var(--white);
  font-size:12.5px;
  font-weight:800;
  letter-spacing:0.1em;
  text-transform:uppercase;
  padding:8px 16px;
  border-radius:999px;
  margin-bottom:18px;
}

.offer h2{
  color:var(--white);
  font-size:clamp(38px,5.6vw,58px);
  line-height:0.95;
  margin:0 0 8px;
}

.offer h2 small{
  display:block;
  font-family:'Manrope',sans-serif;
  text-transform:none;
  font-size:19px;
  font-weight:700;
  color:rgba(255,255,255,0.92);
  letter-spacing:0;
  margin-top:10px;
}

.offer-note{
  color:rgba(255,255,255,0.92);
  font-size:15px;
  font-weight:600;
  margin:22px 0 26px;
  max-width:460px;
}

.spots-bar{
  max-width:340px;
}

.spots-track{
  height:10px;
  background:rgba(7,27,46,0.22);
  border-radius:999px;
  overflow:hidden;
}

.spots-fill{
  height:100%;
  width:40%;
  background:var(--white);
  border-radius:999px;
}

.spots-label{
  color:rgba(255,255,255,0.9);
  font-size:12.5px;
  font-weight:700;
  margin-top:8px;
}

.guarantee-card{
  background:var(--white);
  border-radius:var(--radius-lg);
  padding:34px 30px;
  box-shadow:var(--shadow-soft);
}

.guarantee-card .g-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.guarantee-card h3{
  font-size:19px;
  margin:0;
  color:var(--navy-800);
}

.guarantee-card p{
  font-size:15px;
  color:var(--ink-soft);
  line-height:1.6;
  margin:0 0 18px;
}

.guarantee-card .g-line{
  display:flex;
  gap:10px;
  align-items:flex-start;
  font-size:14px;
  color:var(--ink);
  font-weight:600;
  margin-bottom:10px;
}

.guarantee-card .g-line svg{
  flex:none;
  margin-top:2px;
}

/* ---------- How it works ---------- */
.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  position:relative;
  counter-reset:step;
}

.step{
  position:relative;
  padding:0 26px;
}

.step:not(:last-child)::after{
  content:"";
  position:absolute;
  top:26px;
  right:-14px;
  width:28px;
  height:2px;
  background:
    repeating-linear-gradient(
      90deg,
      var(--teal-400) 0 6px,
      transparent 6px 12px
    );
}

.step-num{
  font-family:'Anton',sans-serif;
  font-size:15px;
  color:var(--white);
  background:var(--navy-800);
  width:52px;
  height:52px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
}

.step h3{
  font-size:18px;
  color:var(--navy-800);
  margin:0 0 8px;
}

.step p{
  font-size:14.5px;
  color:var(--ink-soft);
  line-height:1.6;
  margin:0;
}

/* ---------- Service area ---------- */
.area-section{
  background:var(--navy-950);
  color:var(--white);
}

.area-section .section-head p{
  color:var(--aqua-200);
}

.area-section .eyebrow{
  color:var(--teal-400);
}

.area-section .section-head h2{
  color:var(--white);
}

.chip-grid{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  max-width:760px;
  margin:0 auto;
}

.chip{
  border:1.5px solid rgba(79,192,217,0.5);
  color:var(--aqua-200);
  padding:10px 20px;
  border-radius:999px;
  font-size:14px;
  font-weight:700;
  background:rgba(79,192,217,0.08);
}

.chip.plus{
  border-style:dashed;
  color:var(--teal-400);
}

.honest-note{
  max-width:560px;
  margin:40px auto 0;
  text-align:center;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:var(--radius-md);
  padding:22px 26px;
}

.honest-note p{
  font-size:14px;
  color:var(--aqua-200);
  line-height:1.6;
  margin:0;
}

.honest-note strong{
  color:var(--white);
}

/* ---------- Contact / form ---------- */
.contact{
  background:var(--white);
}

.contact-grid{
  display:grid;
  grid-template-columns:0.9fr 1.1fr;
  gap:56px;
  align-items:start;
}

.contact-copy h2{
  font-size:clamp(28px,3.4vw,36px);
  margin:12px 0 16px;
}

.contact-copy p{
  color:var(--ink-soft);
  font-size:15.5px;
  line-height:1.65;
  margin-bottom:24px;
}

.contact-detail{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}

.contact-detail .ic{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--aqua-200);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.contact-detail strong{
  display:block;
  font-size:15px;
  color:var(--navy-800);
}

.contact-detail span{
  font-size:13.5px;
  color:var(--ink-soft);
}

.form-card{
  background:var(--aqua-100);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:34px;
  box-shadow:var(--shadow-soft);
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  font-size:12.5px;
  font-weight:800;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--navy-800);
  margin-bottom:7px;
}

.field input,
.field select{
  width:100%;
  padding:13px 14px;
  border-radius:var(--radius-sm);
  border:1.5px solid var(--line);
  background:var(--white);
  font-family:'Manrope',sans-serif;
  font-size:14.5px;
  color:var(--ink);
}

.field input:focus,
.field select:focus{
  outline:2.5px solid var(--teal-500);
  outline-offset:1px;
}

.form-submit{
  width:100%;
  margin-top:6px;
  padding:15px;
  font-size:15.5px;
}

.form-fine{
  font-size:12px;
  color:var(--ink-faint);
  margin-top:12px;
  text-align:center;
}

.form-success{
  display:none;
  text-align:center;
  padding:30px 10px;
}

.form-success.show{
  display:block;
}

.form-success .ic-wrap{
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--teal-500);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 16px;
}

.form-success h3{
  color:var(--navy-800);
  font-size:19px;
  margin:0 0 8px;
}

.form-success p{
  color:var(--ink-soft);
  font-size:14.5px;
  margin:0;
}

/* ---------- Footer ---------- */
.footer{
  background:var(--navy-950);
  color:var(--aqua-200);
  padding:56px 0 26px;
}

.footer-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:40px;
  padding-bottom:36px;
  border-bottom:1px solid rgba(255,255,255,0.12);
}

.footer-brand img{
  height:70px;
  width:auto;
  margin-bottom:14px;
}

.footer-brand p{
  font-size:13.5px;
  color:var(--aqua-200);
  opacity:0.8;
  max-width:260px;
  line-height:1.6;
}

.footer-cols{
  display:flex;
  gap:64px;
  flex-wrap:wrap;
}

.footer-col h4{
  font-size:12.5px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--teal-400);
  margin:0 0 16px;
}

.footer-col a,
.footer-col span{
  display:block;
  font-size:14px;
  color:var(--aqua-200);
  margin-bottom:10px;
  font-weight:600;
  opacity:0.9;
}

.footer-col a:hover{
  opacity:1;
  text-decoration:underline;
}

.footer-bottom{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  padding-top:22px;
  font-size:12.5px;
  color:var(--aqua-200);
  opacity:0.65;
}

.badge-inline{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(79,192,217,0.12);
  border:1px solid rgba(79,192,217,0.35);
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  color:var(--teal-400);
}

/* ---------- Responsive ---------- */
@media (max-width:940px){
  .nav-links{display:none;}

  .hero-inner{
    grid-template-columns:1fr;
    text-align:left;
  }

  .hero-visual{
    order:-1;
    padding-bottom:0;
  }

  .hero-visual img{
    width:220px;
  }

  .value-grid{
    grid-template-columns:1fr;
  }

  .offer-inner{
    grid-template-columns:1fr;
  }

  .steps{
    grid-template-columns:1fr;
    gap:36px;
  }

  .step:not(:last-child)::after{
    display:none;
  }

  .contact-grid{
    grid-template-columns:1fr;
  }

  .form-row{
    grid-template-columns:1fr;
  }

  .footer-top{
    flex-direction:column;
  }
}

@media (max-width:560px){
  .wrap{
    padding:0 20px;
  }

  .hero{
    padding-top:20px;
  }

  .hero-inner{
    padding:0 20px;
  }

  .section{
    padding:60px 0;
  }

  .hero-ctas .btn{
    width:100%;
  }
}

@media (prefers-reduced-motion: reduce){
  .wave-divider svg,
  .hero-visual img{
    animation:none !important;
  }
}
</style>
</head>
